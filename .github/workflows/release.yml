name: Release NuGet packages

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  PACKAGE_COMPONENTS: Core Client Server

concurrency:
  group: nuget-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          if [[ "$GITHUB_REF_NAME" != v* || ! "$version" =~ $semver ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH with an optional SemVer prerelease suffix." >&2
            exit 1
          fi

          if [[ "$version" == *-* && "${version#*-}" =~ (^|\.)0[0-9]+(\.|$) ]]; then
            echo "Numeric prerelease identifiers must not have leading zeros." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet restore StaticNorth.Uhp.slnx --locked-mode
      - name: Build tagged version
        run: >-
          dotnet build StaticNorth.Uhp.slnx --configuration Release --no-restore --disable-build-servers
          -p:Version="$PACKAGE_VERSION" -p:PackageVersion="$PACKAGE_VERSION"
      - run: dotnet run --project tests/StaticNorth.Uhp.Client.Tests --configuration Release --no-build --no-restore -- --minimum-expected-tests 179
      - name: Pack NuGet packages
        shell: bash
        run: |
          read -r -a components <<< "$PACKAGE_COMPONENTS"
          for component in "${components[@]}"; do
            dotnet pack "src/StaticNorth.Uhp.$component" --configuration Release --no-build --no-restore --disable-build-servers \
              -p:Version="$PACKAGE_VERSION" -p:PackageVersion="$PACKAGE_VERSION" \
              --output "$RUNNER_TEMP/uhp-packages"
            test -f "$RUNNER_TEMP/uhp-packages/StaticNorth.Uhp.$component.$PACKAGE_VERSION.nupkg"
            test -f "$RUNNER_TEMP/uhp-packages/StaticNorth.Uhp.$component.$PACKAGE_VERSION.snupkg"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uhp-packages-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/uhp-packages
          if-no-files-found: error

  publish-nuget:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '11.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uhp-packages-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/uhp-packages
      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          read -r -a components <<< "$PACKAGE_COMPONENTS"
          for component in "${components[@]}"; do
            dotnet nuget push "$RUNNER_TEMP/uhp-packages/StaticNorth.Uhp.$component.$PACKAGE_VERSION.nupkg" \
              --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
