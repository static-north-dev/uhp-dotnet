name: Real server release gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interoperability:
    runs-on: ubuntu-24.04
    environment: uhp-interoperability
    env:
      UHP_INTEROP_RESULTS: ${{ github.workspace }}/artifacts/interop
      UHP_HARNESSROUTER_BASE_URL: ${{ vars.UHP_HARNESSROUTER_BASE_URL }}
      UHP_HARNESSROUTER_SERVER_VERSION: ${{ vars.UHP_HARNESSROUTER_SERVER_VERSION }}
      UHP_HARNESSROUTER_PROTOCOL_VERSION: ${{ vars.UHP_HARNESSROUTER_PROTOCOL_VERSION }}
      UHP_HARNESSROUTER_HARNESS_ID: ${{ vars.UHP_HARNESSROUTER_HARNESS_ID }}
      UHP_HARNESSROUTER_TOKEN: ${{ secrets.UHP_HARNESSROUTER_TOKEN }}
      UHP_SUPERQODE_BASE_URL: ${{ vars.UHP_SUPERQODE_BASE_URL }}
      UHP_SUPERQODE_SERVER_VERSION: ${{ vars.UHP_SUPERQODE_SERVER_VERSION }}
      UHP_SUPERQODE_PROTOCOL_VERSION: ${{ vars.UHP_SUPERQODE_PROTOCOL_VERSION }}
      UHP_SUPERQODE_HARNESS_ID: ${{ vars.UHP_SUPERQODE_HARNESS_ID }}
      UHP_SUPERQODE_TOKEN: ${{ secrets.UHP_SUPERQODE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Uhp.slnx --locked-mode
      - run: dotnet test tests/Uhp.Client.InteropTests --configuration Release --no-restore --logger trx --results-directory artifacts/test-results
      - run: python3 eng/check-interop.py artifacts/interop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-server-evidence
          path: |
            artifacts/interop
            artifacts/test-results
