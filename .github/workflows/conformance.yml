name: Official Full conformance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    environment: uhp-conformance
    env:
      UHP_API_KEY: ${{ secrets.UHP_CONFORMANCE_TOKEN }}
      UHP_BASE_URL: ${{ vars.UHP_CONFORMANCE_BASE_URL }}
      UHP_HARNESS_ID: ${{ vars.UHP_CONFORMANCE_HARNESS_ID }}
      UHP_MODEL: ${{ vars.UHP_CONFORMANCE_MODEL }}
      UHP_PLUGIN_MCP_URL: ${{ vars.UHP_CONFORMANCE_MCP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HarnessRouter/harnessrouter
          ref: 80d5d369a1ddf14cad8bd9cf3a1a5891d15616b6
          path: artifacts/conformance/upstream
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
          python-version: '3.13'
      - run: dotnet restore tools/StaticNorth.Uhp.Conformance --locked-mode
      - run: dotnet run --project tools/StaticNorth.Uhp.Conformance --configuration Release --no-restore -- verify-suite . artifacts/conformance/upstream
      - run: uv sync --locked --project tools/conformance
      - name: Check required deployment configuration
        shell: bash
        run: |
          test -n "$UHP_API_KEY"
          test -n "$UHP_BASE_URL"
          test -n "$UHP_HARNESS_ID"
          test -n "$UHP_MODEL"
          test -n "$UHP_PLUGIN_MCP_URL"
      - name: Run unmodified official suite
        run: >-
          uv run --frozen --project tools/conformance uhp-conformance
          --base-url "$UHP_BASE_URL" --harness-id "$UHP_HARNESS_ID" --model "$UHP_MODEL"
          --plugin-mcp-url "$UHP_PLUGIN_MCP_URL" --class full
          --json artifacts/conformance/full.json --plain
      - name: Validate strict Full evidence
        run: dotnet run --project tools/StaticNorth.Uhp.Conformance --configuration Release --no-build -- validate . artifacts/conformance/full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-conformance
          path: |
            artifacts/conformance/full.json
            tools/conformance/manifest.json
            tools/conformance/uv.lock
