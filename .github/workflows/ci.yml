name: Verify
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HarnessRouter/harnessrouter
          ref: 80d5d369a1ddf14cad8bd9cf3a1a5891d15616b6
          path: artifacts/conformance/upstream
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: dotnet restore StaticNorth.Uhp.slnx --locked-mode
      - run: dotnet run --project tools/StaticNorth.Uhp.SchemaGen --configuration Release --no-restore -- --check
      - run: dotnet build StaticNorth.Uhp.slnx --configuration Release --no-restore
      - run: dotnet run --project tools/StaticNorth.Uhp.Conformance --configuration Release --no-build --no-restore -- verify-suite . artifacts/conformance/upstream
      - run: dotnet run --project tests/StaticNorth.Uhp.Client.Tests --configuration Release --no-build --no-restore -- --minimum-expected-tests 179 --report-trx --results-directory artifacts/test-results
      - run: dotnet format StaticNorth.Uhp.slnx --no-restore --verify-no-changes
      - run: dotnet pack StaticNorth.Uhp.slnx --configuration Release --no-build --no-restore --disable-build-servers
      - run: python3 tools/package-smoke.py --rid linux-x64 --reference-host
      - name: Publish Native AOT TUnit runner
        run: >-
          dotnet publish tests/StaticNorth.Uhp.Client.Tests --configuration Release --runtime linux-x64
          -p:PublishAot=true -p:RuntimeFrameworkVersion=11.0.0 -p:EnableRequestDelegateGenerator=true
          -p:NuGetLockFilePath=obj/native-tests.lock.json -p:TrimmerSingleWarn=false
          --output artifacts/aot/StaticNorth.Uhp.Client.Tests
      - run: artifacts/aot/StaticNorth.Uhp.Client.Tests/StaticNorth.Uhp.Client.Tests --minimum-expected-tests 179 --report-trx --results-directory artifacts/aot-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            artifacts/packages
            artifacts/test-results
            artifacts/aot-test-results
            artifacts/aot/result.json
            artifacts/aot/fixture.log
